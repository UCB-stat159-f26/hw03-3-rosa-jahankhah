[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-age-package"
version = "0.1.0"
description = "Tennis player career age analysis"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "matplotlib",
    "requests"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
